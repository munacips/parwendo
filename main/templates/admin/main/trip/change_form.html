{% extends "admin/change_form.html" %}
{% block admin_content_content %}
    {{ block.super }}
    <script>
        let map, marker;

        // Inside change_form.html
        function initLiveTracking(tripId) {
            const container = document.getElementById('trip-map-container');
            if (container) container.style.display = 'block';

            if (typeof google === 'undefined') {
                alert("Google Maps library not loaded. Check your API key and connection.");
                return;
            }

            setInterval(() => {
                fetch(`/trips/${tripId}/live-location/`) // Ensure this URL exists in urls.py!
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(data => {
                        if (data.status === 'success') {
                            const pos = { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
                            
                            if (!map) {
                                map = new google.maps.Map(document.getElementById("live-map"), {
                                    zoom: 15,
                                    center: pos,
                                });
                                marker = new google.maps.Marker({ position: pos, map: map, title: data.username });
                            } else {
                                marker.setPosition(pos);
                                map.panTo(pos);
                            }
                        }
                    })
                    .catch(error => console.error('Error fetching location:', error));zz
            }, 5000);
        }
    </script>
    <div class="submit-row">
        <input type="submit" name="_start_live_tracking" value="Start Live Tracking" class="default" onclick="initLiveTracking('{{ original.id }}')" />
    </div>
{% endblock %}
